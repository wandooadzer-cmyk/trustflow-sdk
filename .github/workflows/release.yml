name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every step except publishing to npm and creating the GitHub Release'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Verify version, changelog and package contents
        run: node scripts/verify-release.js "$TAG"
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Dry-run publish
        run: npm publish --dry-run --access public

  publish:
    name: Publish to npm
    needs: verify
    if: github.event_name == 'push' || !inputs.dry-run
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish with provenance
        run: npm publish --provenance --access public $TAG_FLAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_FLAG: ${{ contains(steps.version.outputs.version, '-') && '--tag next' || '' }}

      - name: Extract release notes
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) found = 1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        run: gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE_FLAG: ${{ contains(steps.version.outputs.version, '-') && '--prerelease' || '' }}
