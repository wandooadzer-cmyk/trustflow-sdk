name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run test typecheck
        run: npm run typecheck:tests

      - name: Run linter
        run: npm run lint

      - name: Restore Jest cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ matrix.node-version }}-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'jest.config.js') }}

      - name: Run tests
        if: matrix.node-version != '22.x'
        run: npm test

      - name: Run tests with coverage
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Build package
        run: npm run build

      - name: Build documentation
        run: npm run docs

      - name: Check build artifacts
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.mjs || exit 1
          test -f dist/index.d.ts || exit 1
          echo "✓ All build artifacts present"

  hooks-react:
    name: Hook tests (React ${{ matrix.react-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        react-version: [18, 19]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install React ${{ matrix.react-version }}
        run: >
          npm install --no-save --ignore-scripts
          react@${{ matrix.react-version }}
          react-dom@${{ matrix.react-version }}
          @types/react@${{ matrix.react-version }}
          @types/react-dom@${{ matrix.react-version }}

      - name: Run hook tests
        run: npx jest tests/hooks.test.ts tests/use-

  browser:
    name: Browser compat (jsdom)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run browser-safe suites under jsdom
        run: npx jest tests/utils-extended.test.ts tests/logger.test.ts --env=jsdom

  e2e:
    name: End-to-end (local Stellar network)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Stellar quickstart (local mode)
        run: docker run --rm -d -p 8000:8000 --name stellar stellar/quickstart:latest --local

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Show quickstart logs on failure
        if: failure()
        run: docker logs stellar
